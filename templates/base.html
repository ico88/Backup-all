<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Backup-All{% endblock %} — CRI Catania</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --cri-red: #d32f2f; --cri-dark: #b71c1c; }
    .navbar-brand img { height: 36px; }
    .sidebar { width: 240px; min-height: calc(100vh - 56px); background: #212529; }
    .sidebar .nav-link { color: #adb5bd; padding: .6rem 1.2rem; border-radius: 6px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: var(--cri-red); color: #fff; }
    .sidebar .nav-link i { width: 20px; }
    .main-content { flex: 1; padding: 1.5rem 2rem; background: #f8f9fa; min-height: calc(100vh - 56px); }
    .status-badge { font-size: .75rem; }
    .card-stat { border-left: 4px solid var(--cri-red); }
    .log-box { background: #1e1e1e; color: #d4d4d4; font-family: monospace; font-size:.82rem;
               border-radius: 6px; padding: 1rem; max-height: 500px; overflow-y: auto; }
    .log-ERROR { color: #f48771; }
    .log-WARNING { color: #dcdcaa; }
    .log-INFO { color: #9cdcfe; }
    .step-wizard .step { display:flex; align-items:center; gap:.5rem; color:#6c757d; }
    .step-wizard .step.active { color:var(--cri-red); font-weight:600; }
    .step-wizard .step.done { color:#198754; }
    .step-wizard .step-num { width:28px; height:28px; border-radius:50%; display:flex;
      align-items:center; justify-content:center; border:2px solid currentColor; font-size:.8rem; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark py-1" style="background:var(--cri-dark);">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/dashboard">
        <i class="bi bi-shield-check fs-4"></i> Backup-All &nbsp;<small class="fw-light opacity-75">CRI Catania</small>
      </a>
      <span class="text-white-50 small"><i class="bi bi-circle-fill text-success me-1" style="font-size:.5rem"></i>Sistema attivo</span>
    </div>
  </nav>

  <div class="d-flex">
    <!-- Sidebar -->
    <nav class="sidebar p-3 d-flex flex-column gap-1">
      <a href="/dashboard" class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="/jobs" class="nav-link {% if '/jobs' in request.url.path %}active{% endif %}">
        <i class="bi bi-briefcase"></i> Job di Backup
      </a>
      <a href="/history" class="nav-link {% if 'history' in request.url.path or 'logs' in request.url.path %}active{% endif %}">
        <i class="bi bi-clock-history"></i> Storico
      </a>
      <hr class="border-secondary my-2">
      <p class="text-secondary small px-2 mb-1 text-uppercase" style="font-size:.7rem">Configurazione</p>
      <a href="/wizard/server" class="nav-link">
        <i class="bi bi-server"></i> Aggiungi Server
      </a>
      <a href="/wizard/destination" class="nav-link">
        <i class="bi bi-hdd-network"></i> Aggiungi QNAP
      </a>
      <a href="/wizard/job" class="nav-link">
        <i class="bi bi-plus-circle"></i> Nuovo Job
      </a>
      <hr class="border-secondary my-2">
      <a href="/docs" class="nav-link text-secondary">
        <i class="bi bi-file-earmark-code"></i> API Docs
      </a>
    </nav>

    <!-- Main -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Helper globale: mostra toast
    function showToast(msg, type='success') {
      const div = document.createElement('div');
      div.className = `toast align-items-center text-bg-${type} border-0 position-fixed bottom-0 end-0 m-3`;
      div.setAttribute('role','alert');
      div.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
      document.body.appendChild(div);
      new bootstrap.Toast(div, {delay:4000}).show();
    }
    async function api(method, url, body) {
      const opts = { method, headers: {'Content-Type':'application/json'} };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(url, opts);
      if (!r.ok) { const e = await r.json().catch(()=>({detail: r.statusText})); throw new Error(e.detail || r.statusText); }
      return r.json();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
