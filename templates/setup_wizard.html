<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurazione iniziale — Backup-All</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --cri-red: #e53935; }
    body { background: #0a0c10; color: #e8eaf0; font-family: 'Segoe UI', system-ui, sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .setup-card { background:#1a1d24; border:1px solid #252830; border-radius:14px; padding:2.5rem; max-width:520px; width:100%; }
    .setup-icon { font-size:2.5rem; color:var(--cri-red); }
    .form-control { background:#0d0f14; border:1px solid #252830; color:#e8eaf0; border-radius:7px; }
    .form-control:focus { background:#0d0f14; border-color:var(--cri-red); color:#e8eaf0; box-shadow:0 0 0 3px rgba(229,57,53,.15); }
    .form-control::placeholder { color:#4b5563; }
    .form-label { font-size:.8rem; color:#9ca3af; font-weight:500; }
    .btn-primary { background:var(--cri-red); border-color:var(--cri-red); font-weight:600; }
    .btn-primary:hover { background:#c62828; border-color:#c62828; }
    .step-dots { display:flex; gap:.5rem; justify-content:center; margin-bottom:2rem; }
    .dot { width:8px; height:8px; border-radius:50%; background:#252830; transition:.2s; }
    .dot.active { background:var(--cri-red); }
    .dot.done { background:#22c55e; }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="text-center mb-4">
      <i class="bi bi-shield-shaded setup-icon"></i>
      <h4 class="mt-2 mb-0">Configurazione Iniziale</h4>
      <p style="color:#6b7280;font-size:.85rem;margin-top:.4rem">Backup-All — CRI Catania</p>
    </div>

    <div class="step-dots">
      <div class="dot active" id="dot-1"></div>
      <div class="dot" id="dot-2"></div>
      <div class="dot" id="dot-3"></div>
    </div>

    <!-- Step 1: Accesso -->
    <div id="step-1">
      <h6 class="mb-3"><span style="color:var(--cri-red);font-weight:700">1/3</span> Accedi con l'account admin</h6>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="s1-user" class="form-control form-control-sm" value="admin" readonly style="opacity:.7">
      </div>
      <div class="mb-4">
        <label class="form-label">Password attuale</label>
        <input type="password" id="s1-pw" class="form-control form-control-sm" placeholder="changeme (default)">
      </div>
      <div id="s1-err" style="color:#f87171;font-size:.82rem;margin-bottom:.8rem;display:none"></div>
      <button class="btn btn-primary w-100" onclick="step1Login()">Accedi <i class="bi bi-arrow-right ms-1"></i></button>
    </div>

    <!-- Step 2: Nuova password -->
    <div id="step-2" style="display:none">
      <h6 class="mb-1"><span style="color:var(--cri-red);font-weight:700">2/3</span> Imposta una password sicura</h6>
      <p style="color:#6b7280;font-size:.8rem;margin-bottom:1.2rem">Sostituisci la password di default con una sicura</p>
      <div class="mb-3">
        <label class="form-label">Nuova password</label>
        <input type="password" id="s2-new" class="form-control form-control-sm" placeholder="Minimo 8 caratteri">
      </div>
      <div class="mb-4">
        <label class="form-label">Conferma password</label>
        <input type="password" id="s2-conf" class="form-control form-control-sm">
      </div>
      <div id="s2-err" style="color:#f87171;font-size:.82rem;margin-bottom:.8rem;display:none"></div>
      <button class="btn btn-primary w-100" onclick="step2Password()">Salva password <i class="bi bi-arrow-right ms-1"></i></button>
    </div>

    <!-- Step 3: Completato -->
    <div id="step-3" style="display:none;text-align:center">
      <i class="bi bi-check-circle-fill" style="font-size:3rem;color:#22c55e"></i>
      <h5 class="mt-3">Configurazione completata!</h5>
      <p style="color:#6b7280;font-size:.85rem">Ora puoi aggiungere le sorgenti, le destinazioni e creare i tuoi job di backup.</p>
      <a href="/dashboard" class="btn btn-primary mt-2">Vai alla Dashboard <i class="bi bi-arrow-right ms-1"></i></a>
    </div>
  </div>

<script>
let currentPw = '';

async function step1Login() {
  const pw = document.getElementById('s1-pw').value;
  const err = document.getElementById('s1-err');
  err.style.display='none';
  try {
    const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:pw})});
    if (!r.ok) { const d=await r.json(); err.textContent=d.detail||'Credenziali errate'; err.style.display=''; return; }
    currentPw = pw;
    document.getElementById('step-1').style.display='none';
    document.getElementById('step-2').style.display='';
    document.getElementById('dot-1').className='dot done';
    document.getElementById('dot-2').className='dot active';
  } catch(e) { err.textContent='Errore di connessione'; err.style.display=''; }
}

async function step2Password() {
  const nw = document.getElementById('s2-new').value;
  const cf = document.getElementById('s2-conf').value;
  const err = document.getElementById('s2-err');
  err.style.display='none';
  if (nw.length < 8) { err.textContent='La password deve essere di almeno 8 caratteri'; err.style.display=''; return; }
  if (nw !== cf) { err.textContent='Le password non coincidono'; err.style.display=''; return; }
  try {
    const r = await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:currentPw,new_password:nw})});
    if (!r.ok) { const d=await r.json(); err.textContent=d.detail||'Errore'; err.style.display=''; return; }
    document.getElementById('step-2').style.display='none';
    document.getElementById('step-3').style.display='';
    document.getElementById('dot-2').className='dot done';
    document.getElementById('dot-3').className='dot active';
  } catch(e) { err.textContent='Errore di connessione'; err.style.display=''; }
}
</script>
</body>
</html>
